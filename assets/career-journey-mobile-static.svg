<svg xmlns="http://www.w3.org/2000/svg" width="480" height="351" viewBox="0 0 480 351" role="img" aria-labelledby="career-title career-description">
  <title id="career-title">Career Journey</title>
  <desc id="career-description">Career timeline, left to right: BEGIN: Oct 2025 to Mar 2026, SwanLab, Backend Engineer/SRE; BUILD: Mar 2026 to Aug 2026, SenseTime, AI Infra Engineer; GROW: Sep 2026 to Oct 2026, ByteDance, AI Agent Engineer; NOW: Nov 2026 to Present, Looking for a new opportunity, </desc>
  <style>:root { --loop-duration: 12s; --journey-step-1: 120px; --journey-step-2: 240px; --journey-distance: 360px; }
    :root {
      --surface: #ffffff; --text: #1f2328; --muted: #59636e;
      --line: #d1d9e0; --node: #8493a4; --accent: #087f8c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #0d1117; --text: #e6edf3; --muted: #9198a1;
        --line: #303d50; --node: #6e8097; --accent: #7ee7cf;
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
    .heading { fill: var(--text); font-size: 24px; font-weight: 600; }
    .chapter { fill: var(--muted); font-size: 12px; font-weight: 500; letter-spacing: 2px; }
    .date { fill: var(--muted); font-size: 14px; font-family: ui-monospace, 'SF Mono', Consolas, monospace; }
    /* Keep company labels bright even if an editor does not forward its dark theme to SVG images. */
    .company { fill: #70a5fd; font-size: 17px; font-weight: 500; }
    .role { fill: var(--muted); font-size: 14px; }
    .current { fill: var(--accent); }
    /* Arrival phases match each node's negative delay: 0%, 30%, 60%, 90%. */
    .traveler { animation: journey var(--loop-duration) linear infinite; }
    @keyframes journey {
      0%, 8% { transform: translateX(0); opacity: 1; }
      30%, 38% { transform: translateX(var(--journey-step-1)); opacity: 1; }
      60%, 68% { transform: translateX(var(--journey-step-2)); opacity: 1; }
      90%, 98% { transform: translateX(var(--journey-distance)); opacity: 1; }
      100% { transform: translateX(var(--journey-distance)); opacity: 0; }
    }
    .node-dot, .arrival-halo, .company {
      transform-box: fill-box; transform-origin: center;
      animation-duration: var(--loop-duration);
      animation-delay: var(--hit-delay);
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
    }
    .node-dot { animation-name: node-arrival; }
    .arrival-halo { opacity: 0; animation-name: halo-arrival; }
    .company { animation-name: company-arrival; }
    @keyframes node-arrival {
      0%, 8%, 100% { transform: scale(1); fill: var(--rest-fill); stroke: var(--rest-stroke); }
      2%, 4% { transform: scale(1.28); fill: var(--accent); stroke: var(--accent); }
    }
    @keyframes halo-arrival {
      0% { opacity: 0; transform: scale(.65); }
      2% { opacity: .30; transform: scale(1); }
      8%, 100% { opacity: 0; transform: scale(1.45); }
    }
    @keyframes company-arrival {
      0%, 8%, 100% { fill: #70a5fd; transform: translateY(0) scale(1); }
      2%, 4% { fill: #b6d6ff; transform: translateY(-2px) scale(1.035); }
    }
    .breathing {
      transform-box: fill-box; transform-origin: center;
      animation: breathe 4s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { opacity: .18; transform: scale(1); }
      50% { opacity: .42; transform: scale(1.12); }
    }
    @media (prefers-reduced-motion: reduce) {
      .traveler { display: none; }
      .breathing { animation: none; opacity: .22; }
      .node-dot, .company { animation: none; transform: none; }
      .arrival-halo { animation: none; opacity: 0; }
    }
    
    .heading { font-size: 28px; }
    .chapter { font-size: 16px; letter-spacing: 1px; }
    .date, .role { font-size: 16px; }
    .company { font-size: 18px; }
    
    .traveler { display: none; animation: none; } .breathing { animation: none; opacity: .22; }
    .node-dot, .company { animation: none; transform: none; }
    .arrival-halo { animation: none; opacity: 0; }
</style>
  <text class="heading" x="240" y="38" text-anchor="middle">Career Journey</text>
  <path d="M 60 110 H 420" stroke="var(--line)" stroke-width="1.5" fill="none" />
  <g class="traveler" aria-hidden="true">
    <circle cx="60" cy="110" r="3" fill="var(--accent)" opacity=".75" />
  </g>
  <g data-node="1" text-anchor="middle" style="--hit-delay: 0s; --rest-fill: var(--surface); --rest-stroke: var(--node);">
    <text class="chapter" x="60" y="82">BEGIN</text>
    <circle class="arrival-halo" cx="60" cy="110" r="12" fill="var(--accent)" aria-hidden="true" />
    <circle class="node-dot" cx="60" cy="110" r="5" fill="var(--surface)" stroke="var(--node)" stroke-width="1.5" />
    <text class="date" x="60" y="151">Oct 2025</text>
    <text class="date" x="60" y="173">to Mar 2026</text>
    <text class="company" x="60" y="214"><tspan x="60" dy="0">SwanLab</tspan></text>
    <text class="role" x="60" y="293"><tspan x="60" dy="0">Backend</tspan><tspan x="60" dy="24">Engineer/SRE</tspan></text>
  </g>
  <g data-node="2" text-anchor="middle" style="--hit-delay: -8.4s; --rest-fill: var(--surface); --rest-stroke: var(--node);">
    <text class="chapter" x="180" y="82">BUILD</text>
    <circle class="arrival-halo" cx="180" cy="110" r="12" fill="var(--accent)" aria-hidden="true" />
    <circle class="node-dot" cx="180" cy="110" r="5" fill="var(--surface)" stroke="var(--node)" stroke-width="1.5" />
    <text class="date" x="180" y="151">Mar 2026</text>
    <text class="date" x="180" y="173">to Aug 2026</text>
    <text class="company" x="180" y="214"><tspan x="180" dy="0">SenseTime</tspan></text>
    <text class="role" x="180" y="293"><tspan x="180" dy="0">AI Infra</tspan><tspan x="180" dy="24">Engineer</tspan></text>
  </g>
  <g data-node="3" text-anchor="middle" style="--hit-delay: -4.8s; --rest-fill: var(--surface); --rest-stroke: var(--node);">
    <text class="chapter" x="300" y="82">GROW</text>
    <circle class="arrival-halo" cx="300" cy="110" r="12" fill="var(--accent)" aria-hidden="true" />
    <circle class="node-dot" cx="300" cy="110" r="5" fill="var(--surface)" stroke="var(--node)" stroke-width="1.5" />
    <text class="date" x="300" y="151">Sep 2026</text>
    <text class="date" x="300" y="173">to Oct 2026</text>
    <text class="company" x="300" y="214"><tspan x="300" dy="0">ByteDance</tspan></text>
    <text class="role" x="300" y="293"><tspan x="300" dy="0">AI Agent</tspan><tspan x="300" dy="24">Engineer</tspan></text>
  </g>
  <g data-node="4" text-anchor="middle" style="--hit-delay: -1.2s; --rest-fill: var(--accent); --rest-stroke: var(--accent);">
    <text class="chapter current" x="420" y="82">NOW</text>
    <circle class="arrival-halo" cx="420" cy="110" r="12" fill="var(--accent)" aria-hidden="true" />
    <circle class="breathing" cx="420" cy="110" r="13" fill="var(--accent)" aria-hidden="true" />
    <circle class="node-dot" cx="420" cy="110" r="5.5" fill="var(--accent)" stroke="var(--accent)" stroke-width="1.5" />
    <text class="date" x="420" y="151">Nov 2026</text>
    <text class="date" x="420" y="173">to Present</text>
    <text class="company" x="420" y="214"><tspan x="420" dy="0">Looking for</tspan><tspan x="420" dy="24">a new</tspan><tspan x="420" dy="24">opportunity</tspan></text>

  </g>
</svg>
